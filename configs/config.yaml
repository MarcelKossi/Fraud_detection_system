# Settings of data handling, splitting, evaluation, model selection and serving.
# Every experiment script reads this file.

seed: 42

data:
  raw_path: data/raw/creditcard.csv
  # SHA-256 of the original creditcard.csv; the loader refuses any other file.
  sha256: 76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89
  target: Class
  time_column: Time

split:
  # The last `test_fraction` of the time-ordered, de-duplicated transactions is the hold-out set.
  test_fraction: 0.2
  # Expanding-window cross-validation on the remaining development set.
  n_cv_folds: 4

evaluation:
  threshold: 0.5
  max_fpr: 0.001
  bootstrap_resamples: 1000
  confidence_level: 0.95

baseline_model:
  n_estimators: 100

model_selection:
  feature_set: hour_of_day
  # Number of random-search configurations per model family.
  n_trials:
    logistic_regression: 20
    lightgbm: 30
    xgboost: 30
  # Seeds used to estimate the run-to-run variability of the retained configurations.
  seeds: [0, 1, 2, 3, 4]
  # Target ratio of frauds to legitimate transactions after re-sampling a training fold.
  resampling_ratio: 0.1
  # Share of each training window, taken at its end, reserved to fit probability calibrators.
  calibration_fraction: 0.2

selected_model:
  # Retained by decision D2 (docs/DECISIONS.md); values copied from
  # results/model_selection/search_xgboost.json.
  family: xgboost
  imbalance: none
  calibration: sigmoid
  params:
    colsample_bytree: 0.6210276357557503
    learning_rate: 0.05967212083511124
    max_depth: 4
    min_child_weight: 1.9551434125044704
    n_estimators: 500
    reg_lambda: 8.182111518618424
    subsample: 0.6838915663596266

simulation:
  # Baseline configuration of the Fraud Detection Handbook simulator.
  n_customers: 5000
  n_terminals: 10000
  n_days: 183
  start_date: "2018-04-01"
  radius: 5.0
  seed: 0

behavioural:
  # Lengths of the aggregation windows, in days.
  windows_days: [1, 7, 30]
  # Delay after which the fraud label of a transaction is known, in days.
  delay_days: 7
  test_fraction: 0.2
  n_cv_folds: 4
  seeds: [0, 1, 2]
  # Feature sets compared in the ablation; each is a list of feature groups.
  feature_sets:
    raw: [raw]
    raw_calendar: [raw, calendar]
    raw_customer: [raw, customer]
    raw_terminal: [raw, terminal]
    all: [raw, calendar, customer, terminal]

cost:
  # Handling cost of one alert, in the currency of the amounts. The prediction service
  # alerts when probability x amount exceeds it (decision D3).
  alert_cost: 10.0
  # Alternative values used for the sensitivity analysis.
  sensitivity_alert_costs: [5.0, 10.0, 25.0]
  amount_column: Amount

model_dir: models/fraud_model
results_dir: results
