[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.2.0"
description = "Credit card fraud detection: reproducible training, evaluation and serving."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TAMPLARE K. Marcel" }]
dependencies = [
    "numpy==2.4.3",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "xgboost==3.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Model families and re-sampling methods used by the experiments only.
experiments = ["lightgbm==4.7.0", "imbalanced-learn==0.14.2"]
api = ["fastapi==0.135.1", "uvicorn==0.41.0", "pydantic==2.12.5"]
dashboard = ["streamlit==1.55.0", "requests==2.32.5"]
figures = ["matplotlib==3.10.8"]
dev = ["fraud-detection[experiments,api,figures]", "pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
